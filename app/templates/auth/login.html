<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-page">
    <section class="panel login-panel">
      <div class="panel-head">
        <div>
          <h1>Вход в демо</h1>
          <p>Локальный вход для проверки ролей без Keycloak.</p>
        </div>
      </div>
      <form class="entry-form" method="post" action="/login">
        <section class="info-section">
          <h2>Пользователь</h2>
          <div class="login-options">
            {% for user in users %}
              <label class="login-option">
                <input type="radio" name="login" value="{{ user.login }}" {% if loop.first %}checked{% endif %}>
                <span>
                  <strong>{{ user.display_name }}</strong>
                  <small>{{ role_labels[user.role.value] }}{% if user.region %} · {{ user.region.name }}{% endif %}</small>
                </span>
              </label>
            {% endfor %}
          </div>
        </section>
        <div class="form-actions">
          <button type="submit" class="primary">Войти</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
