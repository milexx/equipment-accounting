<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/app.css?v=20260624-infralearn">
</head>
<body>
  <header class="topbar">
    <div class="brand">Учёт оборудования</div>
    <nav>
      <a href="/">Главная</a>
      <a href="/login" class="active">Вход</a>
    </nav>
  </header>

  <main class="login-page">
    <section class="panel login-panel">
      <div class="panel-head">
        <div>
          <h1>Вход в демо</h1>
          <p>Локальный вход для проверки ролей без Keycloak.</p>
        </div>
      </div>
      <div class="entry-form">
        <section class="info-section">
          <h2>Выберите пользователя</h2>
          <div class="login-options">
            {% for user in users %}
              <form method="post" action="/login" class="login-option-form">
                <input type="hidden" name="login" value="{{ user.login }}">
                <button type="submit" class="login-option-button">
                  <span>
                    <strong>{{ user.display_name }}</strong>
                    <small>{{ role_labels[user.role.value] }}{% if user.region %} · {{ user.region.name }}{% endif %}</small>
                  </span>
                </button>
              </form>
            {% endfor %}
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
