<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ document.title }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Учёт оборудования</div>
    <nav>
      <a href="/">Главная</a>
      <a href="/documentation" class="active">Документация</a>
    </nav>
  </header>

  <main class="workbench">
    <article class="panel documentation-panel">
      <div class="panel-head">
        <div>
          <div class="breadcrumbs"><a href="/documentation">Документация</a> / {{ document.title }}</div>
          <h1>{{ document.title }}</h1>
          <p>{{ document.description }}</p>
        </div>
      </div>
      <pre class="documentation-content">{{ content }}</pre>
    </article>
  </main>
</body>
</html>
