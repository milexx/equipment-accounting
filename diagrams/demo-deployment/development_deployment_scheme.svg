<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Схема разработки, демо-развертывания и переноса в корпоративную среду</title>
  <desc id="desc">Схема показывает текущий путь разработки через GitHub на демо VPS и целевой путь через корпоративный GitLab, пайплайн и корпоративную среду с PostgreSQL, S3 и Keycloak.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .zone { fill: #ffffff; stroke: #cfd6e4; stroke-width: 2; rx: 18; }
      .zone-demo { fill: #fffaf0; stroke: #e7b34d; stroke-width: 2; rx: 18; }
      .zone-target { fill: #f1fbf7; stroke: #3aa77a; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #2f3a4a; stroke-width: 1.6; rx: 12; }
      .box-soft { fill: #f8fbff; stroke: #7d90aa; stroke-width: 1.4; rx: 12; }
      .box-warn { fill: #fff6df; stroke: #d39a2e; stroke-width: 1.6; rx: 12; }
      .box-ok { fill: #eefaf4; stroke: #2f9d72; stroke-width: 1.6; rx: 12; }
      .box-stub { fill: #f5f1ff; stroke: #8063c9; stroke-width: 1.6; rx: 12; stroke-dasharray: 8 5; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #526174; }
      .zone-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; }
      .text { font-family: Arial, sans-serif; font-size: 18px; fill: #202b3c; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #506074; }
      .tiny { font-family: Arial, sans-serif; font-size: 13px; fill: #66758a; }
      .label { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2d3a4e; }
      .arrow { stroke: #44546a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7a8798; stroke-width: 2.4; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 8 6; }
      .arrow-green { stroke: #2f9d72; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrow-orange { stroke: #d08a19; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#44546a" />
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7a8798" />
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f9d72" />
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d08a19" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="920" />

  <text class="title" x="70" y="62">Как разрабатывается и разворачивается решение</text>
  <text class="subtitle" x="70" y="94">Текущий демо-контур на VPS и целевой перенос в корпоративную среду через GitLab и пайплайн</text>

  <rect class="zone" x="55" y="130" width="430" height="650" />
  <text class="zone-title" x="85" y="170">1. Разработка сейчас</text>
  <text class="small" x="85" y="198">Рабочий проект и контроль изменений</text>

  <rect class="box" x="95" y="235" width="350" height="112" />
  <text class="text" x="122" y="270">Рабочая папка проекта</text>
  <text class="small" x="122" y="302">/opt/workspace/projects/equipment-accounting</text>
  <text class="small" x="122" y="328">код, документы, миграции, тесты</text>

  <rect class="box-soft" x="95" y="390" width="350" height="118" />
  <text class="text" x="122" y="426">Локальные проверки</text>
  <text class="small" x="122" y="458">тесты, ruff, compileall</text>
  <text class="small" x="122" y="484">ручная проверка демо-страниц</text>

  <rect class="box" x="95" y="552" width="350" height="118" />
  <text class="text" x="122" y="588">Git commit</text>
  <text class="small" x="122" y="620">история изменений в ветке dev</text>
  <text class="small" x="122" y="646">каждый этап фиксируется отдельно</text>

  <path class="arrow" d="M270 347 L270 385" />
  <path class="arrow" d="M270 508 L270 547" />

  <rect class="zone-demo" x="560" y="130" width="430" height="650" />
  <text class="zone-title" x="590" y="170">2. Текущий демо-контур</text>
  <text class="small" x="590" y="198">Внешний стенд для показа и проверки процесса</text>

  <rect class="box" x="600" y="235" width="350" height="112" />
  <text class="text" x="627" y="270">GitHub origin/dev</text>
  <text class="small" x="627" y="302">текущий внешний репозиторий</text>
  <text class="small" x="627" y="328">push после проверок</text>

  <rect class="box-warn" x="600" y="390" width="350" height="118" />
  <text class="text" x="627" y="426">Демо VPS</text>
  <text class="small" x="627" y="458">ручное развертывание</text>
  <text class="small" x="627" y="484">systemd + uvicorn, порт 8010</text>

  <rect class="box-soft" x="600" y="548" width="165" height="102" />
  <text class="text" x="625" y="584">Web</text>
  <text class="small" x="625" y="616">FastAPI</text>

  <rect class="box-soft" x="785" y="548" width="165" height="102" />
  <text class="text" x="810" y="584">PostgreSQL</text>
  <text class="small" x="810" y="616">dev DB</text>

  <rect class="box-soft" x="600" y="675" width="350" height="72" />
  <text class="text" x="627" y="711">Фото сейчас: файловый каталог</text>
  <text class="small" x="627" y="735">метаданные фото хранятся в БД</text>

  <path class="arrow" d="M775 347 L775 385" />
  <path class="arrow-orange" d="M775 508 L683 543" />
  <path class="arrow-orange" d="M775 508 L867 543" />
  <path class="arrow-orange" d="M683 650 L683 670" />
  <path class="arrow-orange" d="M867 650 L867 670" />

  <rect class="zone-target" x="1070" y="130" width="475" height="650" />
  <text class="zone-title" x="1100" y="170">3. Целевой корпоративный контур</text>
  <text class="small" x="1100" y="198">Управляемое развертывание после пилота</text>

  <rect class="box-ok" x="1115" y="235" width="385" height="94" />
  <text class="text" x="1142" y="270">Корпоративный GitLab</text>
  <text class="small" x="1142" y="302">репозиторий, права, merge requests</text>

  <rect class="box-ok" x="1115" y="365" width="385" height="118" />
  <text class="text" x="1142" y="400">Пайплайн GitLab CI/CD</text>
  <text class="small" x="1142" y="432">тесты -> сборка -> миграции -> deploy</text>
  <text class="small" x="1142" y="458">ручное подтверждение для production</text>

  <rect class="box-ok" x="1115" y="520" width="180" height="96" />
  <text class="text" x="1142" y="556">Web</text>
  <text class="small" x="1142" y="586">FastAPI</text>

  <rect class="box-ok" x="1320" y="520" width="180" height="96" />
  <text class="text" x="1347" y="556">PostgreSQL</text>
  <text class="small" x="1347" y="586">корп. БД</text>

  <rect class="box-stub" x="1115" y="650" width="180" height="92" />
  <text class="text" x="1142" y="686">S3</text>
  <text class="small" x="1142" y="716">заглушка есть</text>

  <rect class="box-stub" x="1320" y="650" width="180" height="92" />
  <text class="text" x="1347" y="686">Keycloak</text>
  <text class="small" x="1347" y="716">заглушка есть</text>

  <path class="arrow-green" d="M1307 329 L1307 360" />
  <path class="arrow-green" d="M1307 483 L1205 515" />
  <path class="arrow-green" d="M1307 483 L1410 515" />
  <path class="arrow-green" d="M1205 616 L1205 645" />
  <path class="arrow-green" d="M1410 616 L1410 645" />

  <path class="arrow" d="M445 611 C505 611 535 291 595 291" />
  <text class="label" x="486" y="525">push</text>

  <path class="arrow-orange" d="M950 291 C1010 291 1045 281 1110 281" />
  <text class="label" x="970" y="270">зеркало / перенос</text>

  <path class="arrow-soft" d="M950 449 C1015 449 1040 424 1110 424" />
  <text class="label" x="970" y="408">будущий путь</text>

  <rect class="box-soft" x="1070" y="805" width="475" height="70" />
  <text class="text" x="1100" y="835">Обязательные условия промышленного контура</text>
  <text class="small" x="1100" y="862">HTTPS, резервные копии БД и фото, журналирование, мониторинг, регламент сопровождения</text>

  <rect class="box-warn" x="560" y="805" width="430" height="70" />
  <text class="text" x="590" y="835">Важно для встречи</text>
  <text class="small" x="590" y="862">VPS - демо-стенд. Корпоративный контур требует отдельного решения по инфраструктуре.</text>

  <rect class="box-soft" x="55" y="805" width="430" height="70" />
  <text class="text" x="85" y="835">Что уже переносимо</text>
  <text class="small" x="85" y="862">код, миграции БД, настройки через переменные окружения, файловое хранилище фото</text>
</svg>
